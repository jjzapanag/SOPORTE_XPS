<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruta Europa">
<title>Ruta Europa 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: columna única para iPhone. Franja de días pegada arriba, raíl de horarios tipo panel de estación a la izquierda. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EDEFF4;
  --ink:#15171D; --muted:#5B6271; --faint:#8A91A0;
  --line:#DFE2EA; --line-soft:#E9EBF1;
  --rail:#2B3F8C; --rail-soft:#E4E8F7;
  --gold:#A8650B; --gold-soft:#FAF0DE;
  --done:#1A7550; --done-soft:#E2F2EA;
  --font-display:'Archivo','Helvetica Neue',sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-time:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1116; --surface:#191C23; --surface-2:#212530;
  --ink:#E9EBF1; --muted:#9BA2B2; --faint:#767D8D;
  --line:#2A2F3A; --line-soft:#232832;
  --rail:#8396EC; --rail-soft:#1D2440;
  --gold:#E0A245; --gold-soft:#2C2314;
  --done:#4FC08D; --done-soft:#14281F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1116; --surface:#191C23; --surface-2:#212530;
  --ink:#E9EBF1; --muted:#9BA2B2; --faint:#767D8D;
  --line:#2A2F3A; --line-soft:#232832;
  --rail:#8396EC; --rail-soft:#1D2440;
  --gold:#E0A245; --gold-soft:#2C2314;
  --done:#4FC08D; --done-soft:#14281F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}

/* cabecera */
.masthead{background:var(--surface);border-bottom:1px solid var(--line)}
.masthead .wrap{padding-block:16px 12px}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.dates{font-family:var(--font-time);font-size:12px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:4px;margin-top:14px;background:var(--surface-2);padding:3px;border-radius:9px}
.tabs button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--font-body);font-weight:500;font-size:13px;padding:7px 4px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.progress{margin-top:14px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:0}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .35s ease}
.pcount{font-family:var(--font-time);font-size:12px;color:var(--muted);white-space:nowrap}

/* franja de días */
.daystrip{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--surface);border-bottom:1px solid var(--line)}
.daystrip .scroller{display:flex;gap:6px;overflow-x:auto;padding:9px max(16px,env(safe-area-inset-left,0px)) 9px max(16px,env(safe-area-inset-right,0px));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.daystrip .scroller::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 9px;cursor:pointer;text-align:center;line-height:1.15;color:var(--muted);font-family:var(--font-body)}
.chip b{display:block;font-family:var(--font-time);font-weight:500;font-size:14px;color:var(--ink)}
.chip span{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase}
.chip[aria-current="true"]{background:var(--rail);border-color:var(--rail);color:#fff}
.chip[aria-current="true"] b{color:#fff}
.chip.full{border-color:var(--done)}
.chip.full b{color:var(--done)}
.chip[aria-current="true"].full b{color:#fff}

/* día */
.dayhead{padding-block:22px 4px}
.eyebrow{font-family:var(--font-time);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--rail)}
h2{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.15;margin:6px 0 0;letter-spacing:-.02em;text-wrap:balance}
.daysub{color:var(--muted);font-size:14px;margin-top:6px}

/* mejor ruta */
.routebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
.routebox h3{font-family:var(--font-time);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px}
.node{font-size:13px;font-weight:500;background:var(--rail-soft);color:var(--rail);padding:4px 9px;border-radius:6px;text-decoration:none;display:inline-block}
.hop{font-family:var(--font-time);font-size:10.5px;color:var(--faint);white-space:nowrap}
.routenote{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.maprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.mapbtn{flex:1 1 150px;text-align:center;text-decoration:none;font-size:12.5px;font-weight:500;padding:9px 10px;border-radius:8px;background:var(--rail);color:#fff;border:1px solid var(--rail)}
.mapbtn.ghost{background:transparent;color:var(--rail)}
.mapnote{margin:10px 0 0;font-size:12px;color:var(--gold)}
.maphint{margin:9px 0 0;font-size:11.5px;color:var(--faint)}

/* línea de tiempo */
.timeline{margin:18px 0 0;padding:0;list-style:none;position:relative}
.timeline::before{content:"";position:absolute;left:61px;top:10px;bottom:10px;width:1px;background:var(--line)}
.stop{display:grid;grid-template-columns:52px 20px minmax(0,1fr);gap:0 10px;align-items:start;padding-block:7px}
.time{font-family:var(--font-time);font-size:12.5px;color:var(--muted);padding-top:9px;text-align:right;font-variant-numeric:tabular-nums}
.marker{display:flex;justify-content:center;padding-top:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);position:relative;z-index:1}
.stop.x .dot{background:var(--line);border-color:var(--line)}
.stop.hi .dot{background:var(--gold);border-color:var(--gold)}
.stop.done .dot{background:var(--done);border-color:var(--done)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0}
.stop.x .card,.stop.m .card{background:transparent;border-color:transparent;padding:6px 2px}
.stop.done .card{border-color:var(--done)}
.cardtop{display:flex;gap:10px;align-items:flex-start}
.titlewrap{flex:1;min-width:0}
.name{font-weight:600;font-size:14.5px;line-height:1.35;letter-spacing:-.005em}
.stop.x .name,.stop.m .name{font-weight:400;font-size:13.5px;color:var(--muted)}
.stop.done .name{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-family:var(--font-time);font-size:10px;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tag.free{background:var(--gold-soft);color:var(--gold)}
.tag.paid{background:var(--rail-soft);color:var(--rail)}
.tag.warn{background:var(--gold-soft);color:var(--gold)}
.check{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;line-height:1;padding:0;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--done)}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}
.detail{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--muted);line-height:1.6}
.detail p{margin:0}
.detail p+p{margin-top:7px}
.detail .tip{color:var(--ink)}
.detail .tip b{font-weight:600}
.expand{appearance:none;border:0;background:transparent;color:var(--rail);font-family:var(--font-body);font-size:12px;font-weight:500;padding:6px 0 0;cursor:pointer}

/* reservas */
.reslist{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:9px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;display:flex;gap:11px;align-items:flex-start}
.res.urgent{border-color:var(--gold)}
.resnum{font-family:var(--font-time);font-size:11px;color:var(--faint);padding-top:2px;min-width:16px}
.res .name{font-size:14px}
.reswhen{font-size:12.5px;color:var(--muted);margin-top:4px}
.reswhere{font-family:var(--font-time);font-size:11.5px;color:var(--rail);margin-top:3px;word-break:break-word}

.note{margin:18px 0 0;font-size:12.5px;color:var(--faint);line-height:1.6}
footer{padding-block:28px 34px}
@media (max-width:380px){
  .timeline::before{left:53px}
  .stop{grid-template-columns:44px 20px minmax(0,1fr)}
  .time{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--rail);outline-offset:2px}

/* --- pantalla de clave --- */
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gatebox{width:100%;max-width:330px;text-align:left}
.gatekicker{font-family:var(--font-time);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--rail)}
.gatebox h1{font-family:var(--font-display);font-weight:700;font-size:28px;margin:8px 0 0;letter-spacing:-.02em}
.gatebox p{color:var(--muted);font-size:13.5px;margin:8px 0 22px;line-height:1.55}
.gatebox label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
.gatebox input[type=password]{width:100%;font-family:var(--font-body);font-size:16px;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.gatebox input[type=password]:focus{outline:2px solid var(--rail);outline-offset:1px;border-color:var(--rail)}
.gatebtn{width:100%;margin-top:12px;appearance:none;border:0;background:var(--rail);color:#fff;font-family:var(--font-body);font-weight:600;font-size:15px;padding:13px;border-radius:10px;cursor:pointer}
.gatebtn[disabled]{opacity:.6;cursor:default}
.remember{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer}
.remember input{width:17px;height:17px;accent-color:var(--rail)}
.gateerr{margin-top:12px;font-size:13px;color:#C0392B;min-height:19px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gateerr{color:#F07A72}}
.applock{visibility:hidden}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gatebox">
    <div class="gatekicker">España · Italia · Francia</div>
    <h1>Ruta Europa</h1>
    <p>19 de noviembre – 5 de diciembre de 2026. El itinerario está cifrado: escribe la clave para abrirlo.</p>
    <label for="pw">Clave</label>
    <input type="password" id="pw" autocomplete="current-password" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="gatebtn" id="gatebtn">Abrir el itinerario</button>
    <label class="remember"><input type="checkbox" id="remember" checked> Recordar en este dispositivo</label>
    <div class="gateerr" id="gateerr" role="alert"></div>
  </div>
</div>

<div class="applock" id="app">
<header class="masthead"><div class="wrap">
  <div class="brandrow">
    <h1>Ruta Europa</h1>
    <div class="dates">19 NOV — 5 DIC 2026</div>
  </div>
  <div class="tabs" role="tablist">
    <button id="tab-dias" role="tab" aria-selected="true">Días</button>
    <button id="tab-reservas" role="tab" aria-selected="false">Reservas</button>
  </div>
  <div class="progress">
    <div class="bar"><i id="barfill"></i></div>
    <div class="pcount" id="pcount">0 / 0 sitios</div>
  </div>
</div></header>

<nav class="daystrip" id="daystrip"><div class="scroller" id="scroller"></div></nav>

<main class="wrap">
  <div id="view-dias"></div>
  <div id="view-reservas" hidden></div>
  <p class="note" id="syncnote"></p>
</main>
<footer class="wrap"></footer>
</div>

const PWKEY="ruta-europa-2026-pw";

function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

async function decrypt(pw){
  const raw=b64(PAYLOAD);
  const salt=raw.slice(0,16), iv=raw.slice(16,28), body=raw.slice(28);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const out=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,body);
  return JSON.parse(new TextDecoder().decode(out));
}

const gate=document.getElementById("gate"), pw=document.getElementById("pw");
const btn=document.getElementById("gatebtn"), err=document.getElementById("gateerr");

async function unlock(pass,fromStore){
  err.textContent=""; btn.disabled=true; btn.textContent="Abriendo…";
  let data=null;
  try{ data=await decrypt(pass); }
  catch(e){
    btn.disabled=false; btn.textContent="Abrir el itinerario";
    if(fromStore){ try{localStorage.removeItem(PWKEY)}catch(_){} return false }
    err.textContent="Esa clave no abre el itinerario."; pw.value=""; pw.focus(); return false;
  }
  if(document.getElementById("remember").checked){ try{localStorage.setItem(PWKEY,pass)}catch(_){} }
  else { try{localStorage.removeItem(PWKEY)}catch(_){} }
  gate.remove();
  document.getElementById("app").classList.remove("applock");
  boot(data.DAYS,data.RESERVAS);
  return true;
}

btn.addEventListener("click",()=>unlock(pw.value,false));
pw.addEventListener("keydown",e=>{if(e.key==="Enter")unlock(pw.value,false)});

(async()=>{
  let saved=null; try{saved=localStorage.getItem(PWKEY)}catch(_){}
  if(saved){ const ok=await unlock(saved,true); if(ok)return; }
  pw.focus();
})();

function boot(DAYS,RESERVAS){





const CHECKABLE=new Set(["v","f"]);
const DOWS=["dom","lun","mar","mié","jue","vie","sáb"];
let checked={}, curDay=1, tab="dias";

DAYS.forEach(d=>d.stops.forEach((s,i)=>{s.id="d"+d.n+"-"+i}));
const allCheckable=DAYS.flatMap(d=>d.stops.filter(s=>CHECKABLE.has(s.k)).map(s=>s.id));

const el=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dayDone(d){const c=d.stops.filter(s=>CHECKABLE.has(s.k));return c.length>0&&c.every(s=>checked[s.id])}

function buildStrip(){
  el("scroller").innerHTML=DAYS.map(d=>{
    const num=d.date.split(" ")[0];
    return `<button class="chip${dayDone(d)?" full":""}" data-day="${d.n}" aria-current="${d.n===curDay}">
      <span>${esc(d.dow.slice(0,3))}</span><b>${esc(num)}</b></button>`;
  }).join("");
}

function gq(base,city){return encodeURIComponent(base.includes(",")?base:base+", "+city)}
function mapsPlace(r,d){return "https://www.google.com/maps/search/?api=1&query="+gq(r.q||r.name,d.gcity)}
function mapsRoute(d,mode){
  const p=d.route.map(r=>gq(r.q||r.name,d.gcity));
  let u="https://www.google.com/maps/dir/?api=1&origin="+p[0]+"&destination="+p[p.length-1];
  const w=p.slice(1,-1);
  if(w.length)u+="&waypoints="+w.join("%7C");
  return u+"&travelmode="+mode;
}

function stopHTML(s){
  const can=CHECKABLE.has(s.k);
  const on=!!checked[s.id];
  const tags=[];
  if(s.p!=null) tags.push(`<span class="tag paid">${s.p} €/pers.</span>`);
  else if(s.k==="f") tags.push(`<span class="tag free">Gratis</span>`);
  if(s.k==="w") tags.push(`<span class="tag warn">Aviso</span>`);
  const body=[];
  if(s.d) body.push(`<p>${esc(s.d)}</p>`);
  if(s.tip) body.push(`<p class="tip"><b>Apunte.</b> ${esc(s.tip)}</p>`);
  const cls=["stop",s.k,on?"done":"",(s.k==="f"||s.k==="w")?"hi":""].filter(Boolean).join(" ");
  const hasDetail=body.length>0;
  return `<li class="${cls}" data-id="${s.id}">
    <div class="time">${esc(s.t)}</div>
    <div class="marker"><div class="dot"></div></div>
    <div class="card">
      <div class="cardtop">
        <div class="titlewrap">
          <div class="name">${esc(s.n)}</div>
          ${tags.length?`<div class="meta">${tags.join("")}</div>`:""}
        </div>
        ${can?`<button class="check" data-check="${s.id}" aria-pressed="${on}" aria-label="Marcar ${esc(s.n)} como visitado">✓</button>`:""}
      </div>
      ${hasDetail?`<div class="detail" hidden>${body.join("")}</div>
        <button class="expand" data-ex="${s.id}">Ver detalle</button>`:""}
    </div></li>`;
}

function renderDay(){
  const d=DAYS.find(x=>x.n===curDay);
  const chain=d.route.map((r,i)=>{
    const hop=i===0?"":`<span class="hop">${r.mode?esc(r.mode)+" ":""}${r.min}m →</span>`;
    return hop+`<a class="node" href="${mapsPlace(r,d)}" target="_blank" rel="noopener">${esc(r.name)}</a>`;
  }).join("");
  const maps=d.nomap?"":`<div class="maprow">
      <a class="mapbtn" href="${mapsRoute(d,"walking")}" target="_blank" rel="noopener">Ruta a pie en Google Maps</a>
      <a class="mapbtn ghost" href="${mapsRoute(d,"transit")}" target="_blank" rel="noopener">En transporte público</a>
    </div>${d.mapnote?`<p class="mapnote">${esc(d.mapnote)}</p>`:""}<p class="maphint">Toca cualquier parada de la cadena para abrirla sola en el mapa.</p>`;
  el("view-dias").innerHTML=`
    <div class="dayhead">
      <div class="eyebrow">Día ${d.n} de 17 · ${esc(d.dow)} ${esc(d.date)}</div>
      <h2>${esc(d.city)}</h2>
      <p class="daysub">${esc(d.sub)}</p>
    </div>
    <div class="routebox">
      <h3>Mejor ruta del día</h3>
      <div class="chain">${chain}</div>
      <p class="routenote">${esc(d.routenote)}</p>
      ${maps}
    </div>
    <ul class="timeline">${d.stops.map(stopHTML).join("")}</ul>`;
}

function renderReservas(){
  el("view-reservas").innerHTML=`
    <div class="dayhead">
      <div class="eyebrow">Antes de salir</div>
      <h2>Qué reservar</h2>
      <p class="daysub">Ordenado por urgencia. Lo de arriba se agota primero.</p>
    </div>
    <ul class="reslist">${RESERVAS.map((r,i)=>`
      <li class="res${r.urgent?" urgent":""}">
        <div class="resnum">${i+1}</div>
        <div style="min-width:0">
          <div class="name">${esc(r.n)}</div>
          <div class="reswhen">${esc(r.when)}</div>
          <div class="reswhere">${esc(r.where)}</div>
          ${r.note?`<div class="reswhen">${esc(r.note)}</div>`:""}
        </div>
      </li>`).join("")}</ul>`;
}

function renderProgress(){
  const n=allCheckable.filter(id=>checked[id]).length;
  el("pcount").textContent=n+" / "+allCheckable.length+" sitios";
  el("barfill").style.width=(allCheckable.length?n/allCheckable.length*100:0)+"%";
}

function renderAll(){
  el("view-dias").hidden=tab!=="dias";
  el("view-reservas").hidden=tab!=="reservas";
  el("daystrip").hidden=tab!=="dias";
  el("tab-dias").setAttribute("aria-selected",tab==="dias");
  el("tab-reservas").setAttribute("aria-selected",tab==="reservas");
  if(tab==="dias"){buildStrip();renderDay()}else{renderReservas()}
  renderProgress();
}

/* ---- navegación por hash ---- */
function readHash(){
  const h=(location.hash||"").replace("#","");
  if(h==="reservas"){tab="reservas";return}
  const m=h.match(/^dia-(\d+)$/);
  tab="dias";
  if(m){const n=+m[1];if(n>=1&&n<=17)curDay=n}
}
function go(h){if(location.hash!=="#"+h)location.hash=h;else{readHash();renderAll()}}
addEventListener("hashchange",()=>{readHash();renderAll();scrollTo({top:0})});

el("tab-dias").onclick=()=>go("dia-"+curDay);
el("tab-reservas").onclick=()=>go("reservas");
el("scroller").onclick=e=>{const b=e.target.closest("[data-day]");if(b)go("dia-"+b.dataset.day)};

document.addEventListener("click",e=>{
  const ex=e.target.closest("[data-ex]");
  if(ex){const det=ex.previousElementSibling;det.hidden=!det.hidden;ex.textContent=det.hidden?"Ver detalle":"Ocultar";return}
  const ck=e.target.closest("[data-check]");
  if(ck){toggle(ck.dataset.check);}
});

/* ---- persistencia ---- */
let dbDoc=null, writing=false, pending=null, adopted=false;
const LS="ruta-europa-2026";
function loadLocal(){try{const v=localStorage.getItem(LS);if(v)checked=JSON.parse(v)||{}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(checked))}catch(e){}}

function toggle(id){
  if(checked[id])delete checked[id];else checked[id]=true;
  saveLocal();
  const li=document.querySelector('[data-id="'+id+'"]');
  if(li){li.classList.toggle("done",!!checked[id]);
    const b=li.querySelector("[data-check]");if(b)b.setAttribute("aria-pressed",!!checked[id]);}
  const d=DAYS.find(x=>x.n===curDay);
  const chip=document.querySelector('[data-day="'+curDay+'"]');
  if(chip&&d)chip.classList.toggle("full",dayDone(d));
  renderProgress();
  queueWrite();
}

function queueWrite(){
  if(!dbDoc)return;
  pending={...checked};
  flush();
}
async function flush(){
  if(writing||!dbDoc||pending===null)return;
  const body=pending;pending=null;writing=true;
  try{await dbDoc.set({checked:body})}
  catch(e){note("No se pudo guardar en la nube. Los checks siguen en este dispositivo.")}
  writing=false;
  if(pending!==null)flush();
}
function note(t){el("syncnote").textContent=t||""}

loadLocal();
readHash();
if(!location.hash){
  const today=new Date();
  const start=new Date(2026,10,19);
  const diff=Math.floor((new Date(today.getFullYear(),today.getMonth(),today.getDate())-start)/864e5);
  if(diff>=0&&diff<17)curDay=diff+1;
}
renderAll();

(async()=>{
  const c=window.claude;
  if(!c||!c.use){note("Los checks se guardan en este dispositivo.");return}
  let db=null;
  try{db=await c.use("db")}catch(e){}
  if(!db){note("Los checks se guardan solo en este dispositivo.");return}
  dbDoc=db.doc("viaje/progreso");
  let timer=setTimeout(()=>note("No hay conexión con la nube todavía. Los checks se guardan en este dispositivo mientras tanto."),10000);
  dbDoc.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);note("")}
    if(adopted||writing||pending!==null)return;
    const data=snap.exists?snap.data():null;
    if(data&&data.checked&&typeof data.checked==="object"){
      checked={...data.checked};saveLocal();renderAll();
    }else if(Object.keys(checked).length){queueWrite()}
    adopted=true;
  },err=>{clearTimeout(timer);note("Los checks se guardan solo en este dispositivo.")});
})();

}
</script>
</body>
</html>
